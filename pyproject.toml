[project]
name = "object-detection-system"
version = "0.1.0"
description = "Django web application for RF-DETR based object detection workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "ikedachin" },
]
dependencies = [
    "channels>=4.2.2",
    "daphne>=4.2.0",
    "django>=5.2.4",
    "fastapi>=0.115.0",
    "ipykernel>=6.29.5",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "pip>=25.1.1",
    "pycocotools>=2.0.8",
    "pyyaml>=6.0.2",
    "rfdetr[train,loggers]",
    "supervision>=0.25.0",
    "uvicorn[standard]>=0.30.0",
]
