plc:
  enabled: false

test_server:
  enabled: true
  host: "127.0.0.1"
  port: 8010
  base_url: "http://127.0.0.1:8010"

checker_api:
  confirm_ws_url: "ws://127.0.0.1:8000/checker/ws/confirm/"
  timeout: 60.0

connection:
  host: "127.0.0.1"
  port: 8010
  # host: "192.168.250.1"
  # port: 9600
  plc_node: 1
  pc_node: 25
  timeout: 3.0

# Wエリアは電源断で値が保持されない（IOM Hold無効が前提）ため、
# 電源再投入時に古いtrigger/結果ビットが残らない
monitor:
  area: "W"
  word_address: 100
  bit: 0
  poll_interval_seconds: 1.0

result_signal:
  complete:
    area: "W"
    word_address: 200
    bit: 0
    on_value: 1
    reset_value: 0
  ok:
    area: "W"
    word_address: 200
    bit: 1
    ok_value: 1
    ng_value: 0
    reset_value: 0
  error:
    area: "W"
    word_address: 200
    bit: 2
    on_value: 1
    reset_value: 0
